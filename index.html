<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#7B1E8F">
<title>MBCO · لوحة العمليات الموحدة</title>
<script>
  /* يطبّق اللغة والوضع قبل الرسم لتجنب الوميض */
  (function () {
    var th = null, lg = null;
    try { th = localStorage.getItem('mbco_theme'); lg = localStorage.getItem('mbco_lang'); } catch (e) {}
    if (!th) th = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', th);
    if (lg === 'en') { document.documentElement.lang = 'en'; document.documentElement.dir = 'ltr'; }
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
